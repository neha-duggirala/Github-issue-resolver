name: Run PR Rviewer

on:
  workflow_dispatch:
    branches: [ "github-action" ]

jobs:
  run-bin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Create venv and install dependencies
        run: uv sync --frozen

      - name: Run Reviewer Agent script
        run: |
          uv run github_pr_reviewer/main.py 'Can you add a review this PR: https://github.com/neha-duggirala/Github-issue-resolver/pull/4' --verbose
        env:
          MODEL: ${{ secrets.MODEL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PR_REVIEWER_GITHUB_TOKEN }}
