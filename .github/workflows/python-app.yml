name: Python CI with uv

on:
  workflow_dispatch:
    branches: [ "github-action" ]

jobs:
  run-bin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Create venv and install dependencies
        run: uv sync --frozen

      - name: Run bin.py
        run: python github_pr_reviewer/bin.py
        env:
          MODEL: ${{ secrets.MODEL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
